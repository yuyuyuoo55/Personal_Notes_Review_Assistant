[project]
name = "personal-notes-review-assistant"
version = "0.1.0"
description = "个人笔记复习助手：本地笔记检索、带来源问答与小测"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "bm25s>=0.2,<0.3",
    "chromadb>=1.5,<2",
    "dashscope>=1.25,<2",
    "fastapi>=0.141,<0.142",
    "httpx>=0.28,<0.29",
    "langchain>=1.3,<2",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4,<1",
    "langchain-deepseek>=1.0,<2",
    "langchain-text-splitters>=1.1,<2",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.2,<2",
    "python-multipart>=0.0.32",
    "streamlit>=1.60,<1.61",
    "uvicorn[standard]>=0.52,<0.53",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
